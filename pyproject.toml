[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neon-sorting-studio"
version = "0.1.0"
description = "Desktop sorting visualizer built with Python and Pygame."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6,<3.0",
]

[project.scripts]
neon-sorting-studio = "sorting_visualizer.app:main"

[tool.setuptools.packages.find]
include = ["sorting_visualizer*"]
